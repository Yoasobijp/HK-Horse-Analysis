name: My First Workflow
on: 
  push:
    branches: 
      - main
  workflow_dispatch: # 允許手動觸發
jobs:
  first_job:
    runs-on:  ubuntu-latest
    
    steps: 
      - name: Hello_world
        run: echo "Hello world 👋 from ${{ github.actor }}."
      
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          run: tree
