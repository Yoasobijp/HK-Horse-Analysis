name: My First Workflow
on: 
  push:
    branches: 
      - main
  workflow_dispatch: # 允許手動觸發
jobs:
  first_job:
    runs-on:  ubuntu-latest
    
    steps: 
      - name: Hello_world
        run: |
          echo "Hello ${{vars.WHO_WILL_USE}} 👋 from ${{ github.actor }}."
          echo "My secret is 🤔 ${{ secrets.JP_SECRET }}."
      
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
          run: tree
