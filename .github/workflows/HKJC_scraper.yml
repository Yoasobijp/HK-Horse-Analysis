name: HKJC_scraper
on: 
  push:
    branches: 
      - main
  workflow_dispatch: # 允許手動觸發
  
jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 0
        
      - name: Setup Python
        uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirement.txt

      - name: Run race day scraper
        run: python hkjc_results_scraper.py --season 26_27 --min-delay 2 --max-delay 4 --output hkjc_results_26_27.xlsx --db hkjc_results.sqlite

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add 
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "chore(data): daily HKJC snapshot $(date -u +%F)"
            git push
          fi


